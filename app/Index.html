<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Builder</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/open-sauce-one">
<style>
:root{--bg:#FAFAFA;--fg:#111;--card:#fff;--soft:#EFEFEF;--soft2:#F0F0F0;--soft3:#F3F3F3;--line:#DDD;--muted:#666;--dash:#9a9a9a;--off:#E8E8E8;--offb:#C4C4C4;--offf:#9A9A9A;--chipb:#BDBDBD;--green:#5CB85C;--green2:#4CA84C;--hover:#E4F3E4;--red:#B33;--redbg:#FBEAEA;--redfg:#7A1F1F;--shadow:rgba(0,0,0,.18)}
:root[data-theme=dark]{--bg:#151515;--fg:#F2F2F2;--card:#1F1F1F;--soft:#232323;--soft2:#1C1C1C;--soft3:#202020;--line:#3A3A3A;--muted:#A0A0A0;--dash:#4A4A4A;--off:#2A2A2A;--offb:#444;--offf:#777;--chipb:#555;--hover:rgba(92,184,92,.2);--red:#E06666;--redbg:rgba(224,102,102,.12);--redfg:#F2B8B8;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Open Sauce One','Open Sauce Sans',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--fg)}a:hover{color:var(--green)}
button,select,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
select{background:transparent;color:var(--fg)}
select option{color:#111;background:#fff}
.muted{color:var(--muted)}
.b{font-weight:700}
.row{display:flex;align-items:center}
.sp{flex:1}
.ham{width:40px;height:40px;flex:none;border:1.5px solid var(--fg);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;background:transparent;color:var(--fg)}
.ham:hover{background:var(--soft)}
.ham svg{width:20px;height:20px;display:block}
.btn{height:40px;padding:0 16px;border:1.5px solid var(--fg);border-radius:8px;background:var(--bg);color:var(--fg);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.g{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.btn.g:hover{background:var(--green2)}
.btn.g[disabled],.btn.g.dis{background:#BDBDBD;border-color:#BDBDBD;cursor:not-allowed}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.lg{height:48px;font-size:15px}
.linkbtn{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;font-size:13px}
.seg{display:flex;border:1.5px solid var(--fg);border-radius:8px;overflow:hidden}
.seg>*{padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;border:0;background:transparent;white-space:nowrap}
.seg>.on{background:var(--fg);color:var(--bg)}
.lbl{font-weight:800;font-size:12px;letter-spacing:.12em}
.lbl2{font-weight:700;font-size:11px;letter-spacing:.1em;opacity:.78}
.tinp{color:var(--fg)}
.tinp:focus{border:1.5px solid var(--fg)!important;background:var(--card)!important}
.inp{height:42px;border:1.5px solid var(--fg);border-radius:8px;background:var(--card);padding:0 12px;font-size:14px;outline:none;width:100%}
.sel{height:34px;border:1.5px solid var(--fg);border-radius:8px;padding:0 8px;font-size:13px;font-weight:600;cursor:pointer}
.hsel{height:40px;border:1.5px solid var(--fg);border-radius:8px;background:var(--bg);font-size:14px;font-weight:700;padding:0 10px;cursor:pointer;min-width:96px}
/* Sapaan dengan animasi mengetik */
.gr{position:relative;display:block}
.gr>.ghost{visibility:hidden}
.gr>.vis{position:absolute;left:0;top:0;right:0}
.gr .gh{display:block;font-size:var(--gh);font-weight:800;line-height:1.15}
.gr .gm{display:block;font-size:var(--gm);font-weight:800;line-height:1.28;margin-top:var(--gg)}
.gr i{display:inline-block;width:.09em;min-width:2px;height:1.05em;background:var(--green);margin-left:3px;vertical-align:-.15em;animation:blink 1s step-end infinite}
.gr i.off{display:none}
.gr .gm.mv{font-style:italic}
.gr .gm.gst{display:grid}.gr .gst>span{grid-area:1/1}.gr .gst>.mv{font-style:italic}
@keyframes blink{50%{opacity:0}}
.msel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.mpill{white-space:nowrap;font-size:11px;font-weight:700;padding:3px 6px;border-radius:10px;border:1.5px solid var(--fg);cursor:pointer}
.env{display:block}
.jadd{width:28px;height:28px;flex:none;border:1.5px solid var(--fg);border-radius:8px;background:var(--bg);color:var(--fg);font-size:18px;font-weight:700;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.jadd:hover{background:var(--green);border-color:var(--green);color:#fff}
textarea{outline:none}
textarea::placeholder{color:var(--muted);opacity:.55}
/* Motivasi */
.mvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.mvc{border:1.5px solid var(--fg);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--card);min-width:0}
.mvc.on{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.mvc.none{border-style:dashed;background:transparent}.mvc.none.on{border-style:solid}
.mvc .pv{display:flex;flex-direction:column;gap:4px;font-size:13px;font-style:italic;color:var(--muted);min-width:0}
.mvc .pv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvbadge{flex:none;font-size:10px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--green);border-radius:999px;padding:5px 10px}
.mvacts{display:flex;gap:16px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.mvrow{display:flex;align-items:flex-start;gap:8px}
.mvrow.over{box-shadow:0 -2px 0 var(--green)}
.mvrow textarea{flex:1;min-width:0;height:58px;resize:none;border:1.5px solid var(--fg);border-radius:8px;background:var(--card);color:var(--fg);padding:8px 10px;font-size:14px;line-height:1.45;font-family:inherit}
.mvh{width:20px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;cursor:grab;color:var(--muted);font-weight:800;letter-spacing:-2px;user-select:none}
.mvn{width:18px;flex:none;text-align:center;font-weight:800;font-size:13px;padding-top:10px}
.mvbt{display:flex;flex-direction:column;gap:2px}.mvbt .x{height:28px}.mvbt .x[disabled]{opacity:.3}
.chip{display:inline-flex;align-items:center;white-space:nowrap;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--fg);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}

/* Status simpan */
.ind{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1.5px solid var(--line);border-radius:14px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg)}
.ind i{width:8px;height:8px;border-radius:50%;background:var(--green);display:block}
.ind.saving i{background:#BDBDBD;animation:pl 1s ease-in-out infinite}
.ind.pending i{background:#F0A030}
.ind.failed{border-color:#D33;color:#D33}.ind.failed i{background:#D33}
.ind button{border:0;background:none;padding:0;font-weight:800;text-decoration:underline;color:inherit;font-size:12px}
@keyframes pl{50%{opacity:.3}}

/* Dashboard desktop (1a) */
.dash-wrap{overflow-x:auto;min-height:100vh}
.dash{display:grid;grid-template-columns:260px auto 300px;column-gap:28px;row-gap:32px;padding:24px 32px 120px;width:max-content;margin:0 auto}
.h-title{box-sizing:border-box;border-top:2px solid var(--fg);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800}
.wk{display:flex;background:var(--fg);color:var(--bg);height:30px}
.wk>div{flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.wk>div+div{border-left:1.5px solid var(--bg)}
.dr{display:flex;height:26px}
.dr>div,.cell,.bar,.dl,.ms,.ji{width:28px;flex:none;display:flex;align-items:center;justify-content:center}
.sep{border-left:1.5px solid var(--fg)}
.dr>div{font-size:11px;font-weight:700}
.dr.num>div{font-size:12px;font-weight:400}
.dnum{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dnum.today{background:var(--fg);color:var(--bg)}
.grow{display:flex;height:32px;border-bottom:1px dashed var(--dash)}
.cell{position:relative;cursor:pointer;height:100%}
.cell:hover{background:var(--hover)}
.box{width:16px;height:16px;border:1.5px solid var(--fg);border-radius:2px;background:var(--card);color:var(--bg);font-size:12px;line-height:13px;text-align:center;font-weight:700}
.box.on{background:var(--fg)}
.cell.off{cursor:not-allowed}.cell.off:hover{background:none}
.cell.off .box{border-color:var(--offb);background:var(--off);color:var(--offf)}
.cell.saving .box{opacity:.4}
.cell.pending::after{content:'';position:absolute;top:3px;right:2px;width:6px;height:6px;border-radius:50%;background:#F0A030}
.cell.failed::after{content:'';position:absolute;left:5px;right:5px;bottom:3px;height:2px;background:#D33}
.hrow{height:32px;border-bottom:1px dashed var(--dash);display:flex;align-items:center;gap:12px;font-size:14px}
.hrow:hover{background:var(--soft2)}
.hrow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hrow .nm:hover{text-decoration:underline}
.hrow .grip{color:#aaa;font-size:11px;letter-spacing:-1px;padding-right:6px;cursor:grab}
.hrow.over{box-shadow:inset 0 2px 0 var(--green)}
.addrow{margin-top:10px;height:32px;border:1.5px dashed var(--fg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;background:transparent;width:100%}
.addrow:hover{background:var(--soft2)}
.mh-sel{display:grid;grid-template-columns:80px 1fr;border:1.5px solid var(--fg);font-size:13px;flex:1}
.mh-sel>div{padding:7px 10px;font-weight:700}
.mh-sel select{width:100%;height:100%;border:0;font-size:13px;padding:0 8px;cursor:pointer}
.pg{display:grid;grid-template-columns:52px 1fr 64px;align-items:center;font-size:12px;height:32px;border-bottom:1px dashed var(--dash)}
.pg>span:first-child{border-right:1px solid var(--fg);height:100%;display:flex;align-items:center;justify-content:center}
.ms{position:relative;height:30px;font-size:12px;font-weight:600;cursor:pointer}
.ms:hover{outline:1.5px solid var(--fg);outline-offset:-2px}
.ji{height:30px}
.top10{display:grid;grid-template-columns:34px 1fr 64px;height:32px;border-bottom:1px dashed var(--dash);align-items:center;font-size:13px}
.fab{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg);border:2px solid var(--fg);border-radius:12px;box-shadow:0 6px 20px var(--shadow)}
.empty-card{border:1.5px dashed var(--fg);border-radius:10px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-top:16px}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug button{border:1.5px solid var(--chipb);border-radius:16px;background:var(--bg);padding:6px 12px;font-size:13px}
.sug button:hover{background:var(--soft)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;width:100%;background:transparent}
.opt.on{border:2px solid var(--fg);background:var(--card)}
.radio{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--fg);display:flex;align-items:center;justify-content:center;margin-top:2px}
.radio i{width:8px;height:8px;border-radius:50%;background:transparent;display:block}
.on>.radio i,.radio.on i{background:var(--fg)}
.banner{grid-column:1/-1;display:flex;align-items:center;gap:16px;border:2px solid var(--fg);border-radius:10px;padding:14px 18px;background:var(--card)}

/* Halaman umum */
.topbar{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:16px;height:72px;padding:0 32px;background:var(--bg);border-bottom:2px solid var(--fg)}
.topbar h1{margin:0;font-weight:800;font-size:24px;letter-spacing:.12em;line-height:1;white-space:nowrap}
.cloud{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;border:0;background:none;padding:0;color:var(--fg)}
.cloud b{position:absolute;right:3px;bottom:6px;width:9px;height:9px;border-radius:50%;background:var(--green);border:1.5px solid var(--bg)}
.cloud.saving b{background:#BDBDBD;animation:pl 1s ease-in-out infinite}
.cloud.pending b{background:#F0A030}
.cloud.failed b{background:#D33}
.pg-body{padding:24px;max-width:1280px;margin:0 auto}

/* Jurnal (4a) */
.jgrid{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 72px)}
.jtoday{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1.5px dashed var(--fg);border-radius:12px;cursor:pointer;width:100%;background:transparent;text-align:left}
.jtoday:hover{background:var(--soft2)}
.jlist{border-right:2px solid var(--fg);overflow-y:auto;padding:12px 14px 40px}
.jgh{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:13px;margin:14px 2px 8px}
.jcard{display:flex;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:transparent;width:100%;text-align:left}
.jcard.on{border:2px solid var(--fg);background:var(--card)}
.jcard .d{width:34px;flex:none;text-align:center}
.jcard .d b{display:block;font-size:20px;line-height:1.1}
.jcard .d span{font-size:9px;color:var(--muted)}
.jcard .tx{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jedit{padding:22px 28px;display:flex;flex-direction:column;gap:14px;min-height:0}
.jedit textarea{flex:1;min-height:240px;resize:none;border:1.5px solid var(--fg);border-radius:8px;background:var(--card);padding:12px;font-size:15px;line-height:1.55}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{height:32px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg);border:1.5px solid #BDBDBD}
.moodgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moodgrid button{height:60px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--bg);border:1.5px solid #BDBDBD}
.moodgrid b{font-size:17px}.moodgrid span{font-size:10px}

/* Statistik (3b) */
.kpi{display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap}
.kpi .v{font-weight:800;font-size:32px}
.chart{background:var(--soft2);border-radius:6px;padding:8px 0}
.mx{overflow-x:auto}
.mx table{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:760px;width:100%}
.mx th{font-size:10px;font-weight:700;color:var(--muted);text-align:center}
.mx td.c{width:44px;height:24px;text-align:center;font-size:10px;font-weight:700;border-radius:3px}
.mx td.n{white-space:nowrap;padding-right:10px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.mx td.t{text-align:right;font-weight:800;padding-left:8px}
.mx tr.tot td{border-top:2px solid var(--fg);padding-top:6px}
.chk{width:18px;height:18px;border:1.5px solid var(--fg);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--card);color:var(--bg)}
.chk.on{background:var(--fg)}

/* Pengaturan (3d) */
.srow{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow h3{margin:0 0 3px;font-size:15px}
.mrow{display:flex;align-items:center;gap:10px}
.mrow .inp{height:40px}
.mnum{width:32px;height:32px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.srow p{margin:0;font-size:12px;color:var(--muted)}

/* Menu (3a) */
.ov{position:fixed;inset:0;z-index:50;background:rgba(17,17,17,.4);display:flex}
.drawer{width:260px;max-width:86vw;height:100%;background:var(--bg);border-right:2px solid var(--fg);display:flex;flex-direction:column;padding:18px 14px}
.mi{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.mi:hover{background:var(--soft)}
.mi.on{background:var(--fg);color:var(--bg)}
.mi svg{width:18px;height:18px;flex:none}
.mtg{height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:transparent}
.mtg:hover{background:var(--soft)}
.mtg svg{width:18px;height:18px}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(17,17,17,.35);display:flex;justify-content:center;align-items:flex-start;padding:60px 16px;overflow-y:auto}
.panel{background:var(--bg);border:2px solid var(--fg);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;width:100%}
.handle{display:flex;justify-content:center;padding-top:8px;flex:none}
.handle i{width:40px;height:4px;border-radius:2px;background:var(--offb)}
.pbody{flex:1;min-height:0;overflow-y:auto}
.delband{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--redbg);border-top:1.5px solid var(--red);flex-wrap:wrap}
.delband>span{font-size:13px;color:var(--redfg);font-weight:600}
.btn.redfill{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1.5px solid var(--fg)}
.kbd{display:inline-block;min-width:26px;padding:2px 7px;border:1.5px solid var(--fg);border-bottom-width:3px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;line-height:18px;text-align:center;background:var(--bg);color:var(--fg)}
.phead h2{margin:0;font-weight:800;font-size:20px}
.x{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border-radius:6px;border:0;background:transparent}
.x:hover{background:var(--soft)}
.pfoot{display:flex;gap:10px;align-items:center;padding:16px 20px;border-top:1.5px solid var(--fg)}
.qrow{min-height:44px;display:flex;align-items:center;gap:12px;padding:0 8px;border-bottom:1px dashed #BDBDBD;cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.qrow:hover{background:var(--soft2)}
.qbox{width:22px;height:22px;flex:none;border:2px solid var(--fg);border-radius:3px;background:var(--card);color:var(--bg);font-size:15px;line-height:18px;text-align:center;font-weight:700}
.qbox.on{background:var(--fg)}
.qbox.saving{opacity:.4}
.prog{display:flex;align-items:center;gap:12px}
.prog>div{flex:1;height:8px;background:#E2E2E2;border-radius:4px}
:root[data-theme=dark] .prog>div{background:#333}
.prog>div>div{height:100%;background:var(--fg);border-radius:4px;transition:width .2s}
.fr{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;white-space:nowrap;border:1.5px solid #C9C9C9;border-radius:8px;font-size:14px;cursor:pointer}
.fr.on{border-color:var(--fg);background:var(--card)}
.fr input{width:52px;height:28px;border:1.5px solid var(--fg);border-radius:6px;background:var(--card);padding:0 6px;font-size:14px;text-align:center}
.tg{display:flex;gap:5px}
.tg button{flex:1;height:36px;border:1.5px solid var(--chipb);border-radius:8px;background:var(--bg);font-size:13px;font-weight:600;padding:0}
.tg button.on{background:var(--fg);color:var(--bg);border:2px solid var(--fg)}
.cal2{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal2.hd{font-size:10px;font-weight:700;text-align:center}
.cal2>div{height:34px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:4px}
.cal2>div>span{width:16px;text-align:right;font-size:11px;font-weight:600;color:var(--muted)}

function tr(s,v){
  const en=S.settings.lang==='en'&&EN[s]!=null;let o=en?EN[s]:s;
  if(v)o=o.replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m);
  // Bahasa Inggris: "1 habits" → "1 habit"
  if(en)o=o.replace(/\b1 (habit|journal|day|change|month|check|motivation|template)s\b/g,'1 $1').replace(/\b1 entries\b/g,'1 entry');
  return o;
}
let LANG_CUR=null;
function applyLang(){
  const k=S.settings.lang==='en'?'en':'id';if(LANG_CUR===k)return;LANG_CUR=k;const P=LANGS[k];
  MID.splice(0,12,...P.mon);DAYID.splice(0,7,...P.day);DS.splice(0,7,...P.ds);SUGGEST.splice(0,SUGGEST.length,...P.sug);JPH=P.jph;
}

/* ═════════════ Skala mood (bisa diubah di Pengaturan, 2–10 skor) ═════════════ */
const MAX_MOOD=10;
const MOOD_STOPS=[[246,198,198],[248,213,181],[245,227,163],[207,232,196],[47,122,74]];
const moodLabels=()=>{const c=S.settings.moods;return Array.isArray(c)&&c.length>=2?c:LANGS[LANG_CUR||'id'].mood;};
const moodN=()=>moodLabels().length;
const ML=v=>moodLabels()[v-1]||'';
const moodLbl=v=>ML(v)?`${v}. ${ML(v)}`:String(v);
const moodRange=()=>Array.from({length:moodN()},(_,i)=>i+1);
// Warna skor: merah → kuning → hijau, dibagi rata sesuai jumlah skor (5 skor = warna template asli)
function moodC(v){
  const N=moodN();v=Math.min(Math.max(v,1),N);
  const t=N>1?(v-1)/(N-1)*4:4,i=Math.min(3,Math.floor(t)),f=t-i,a=MOOD_STOPS[i],b=MOOD_STOPS[i+1];
  const c=a.map((x,j)=>Math.round(x+(b[j]-x)*f)),lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
  return [`rgb(${c.join(',')})`,lum<0.55?'#fff':'#111'];
}

/* Sapaan dashboard: diketik huruf per huruf, lanjut dari posisi terakhir walau halaman di-render ulang.
   Setelah sapaan + pesan selesai, baris pesan berganti ke motivasi dari template aktif, diketik satu per satu secara acak dan berputar terus. */
const greetDefault=()=>LANGS[S.settings.lang==='en'?'en':'id'].greet;
// ph: intro (sapaan+pesan diketik) → hold (teks utuh, jeda) → del (dihapus) → type (motivasi berikutnya) → hold … · idle = berhenti
// src = motivasi template aktif, sents = urutan acak putaran ini
const TY={key:null,hi:'',msg:'',src:[],sents:[],ph:'idle',n:0,cur:'',c:0,i:0,mv:false,t:null,done:false};
const RM=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
// Baris 1 = sapaan nama (besar), baris 2 = pesan / motivasi (lebih kecil)
function greetParts(){const nm=(S.settings.name||'').trim(),ms=(S.settings.msg==null?greetDefault():S.settings.msg).trim();return {hi:S.settings.lang==='en'?(nm?`Hi, ${nm}!`:'Hi there!'):`Hai, ${nm||'kamu'}!`,msg:ms};}
const tySents=()=>{const a=motAct();return a?a.items.filter(x=>x&&x.trim()):[];};
// Acak urutan; motivasi pertama di putaran baru tidak sama dengan yang terakhir tampil
function tyShuf(a,avoid){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}if(r.length>1&&r[0]===avoid)[r[0],r[1]]=[r[1],r[0]];return r;}
const greetText=()=>{const g=greetParts();return [g.hi,g.msg,...tySents()].filter(Boolean).join(' ');};
const caret0=()=>`<i class="${TY.done?'off':''}"></i>`;
// size: ukuran sapaan, pesan, dan jarak antarbaris (px)
function greetHtml(size){
  const g=greetParts(),key=g.hi+'\n'+g.msg;
  if(TY.key!==key){
    const src=tySents();Object.assign(TY,{key,hi:g.hi,msg:g.msg,src,sents:tyShuf(src),i:0,mv:false,cur:g.msg,c:g.msg.length});
    if(RM())tyStatic();else{Object.assign(TY,{ph:'intro',n:0,done:false});tyGo(55);}
  }else tySync();
  // Bayangan tak terlihat menahan tinggi kotak = teks terpanjang, supaya tata letak tidak melompat saat motivasi berganti
  const l2=[TY.msg,...TY.sents.map(x=>'\u0001'+x)].filter(x=>x&&x!=='\u0001');
  const ghost=`<span class="gh">${esc(TY.hi)}</span>${l2.length?`<span class="gm gst">${l2.map(x=>x[0]==='\u0001'?`<span class="mv">${esc(x.slice(1))}</span>`:`<span>${esc(x)}</span>`).join('')}</span>`:''}`;
  return `<span class="gr" style="--gh:${size[0]}px;--gm:${size[1]}px;--gg:${size[2]}px"><span class="ghost" aria-hidden="true">${ghost}</span><span class="vis" aria-label="${esc(greetText())}" data-typer>${greetInner()}</span></span>`;
}
function greetInner(){
  const intro=TY.ph==='intro',h=TY.hi.length,n=TY.n,hasL2=!!(TY.msg||TY.sents.length||TY.cur);
  const hi=intro?TY.hi.slice(0,n):TY.hi,l2=intro?TY.msg.slice(0,Math.max(0,n-h)):TY.cur.slice(0,TY.c);
  const at=intro&&(n<h||!TY.msg)?0:(hasL2?1:0);
  return `<span class="gh">${esc(hi)}${at===0?caret0():''}</span>${hasL2?`<span class="gm${TY.mv&&!intro?' mv':''}">${esc(l2)}${at===1?caret0():''}</span>`:''}`;
}
function paintGreet(){document.querySelectorAll('[data-typer]').forEach(e=>e.innerHTML=greetInner());}
function tyGo(ms){clearTimeout(TY.t);TY.t=setTimeout(tyStep,ms);}
// Tanpa animasi (prefers-reduced-motion): langsung tampilkan satu motivasi acak
function tyStatic(){clearTimeout(TY.t);const s=TY.sents;Object.assign(TY,{ph:'idle',done:true,cur:s.length?s[0]:TY.msg,mv:!!s.length});TY.c=TY.cur.length;}
function tyStep(){
  const S2=TY.sents;
  switch(TY.ph){
    case 'intro':{const len=TY.hi.length+TY.msg.length;TY.n++;
      if(TY.n>=len){Object.assign(TY,{n:len,ph:'hold',cur:TY.msg,c:TY.msg.length,mv:false});tyGo(S2.length?2600:1800);}else tyGo(55);break;}
    case 'hold':
      // Tanpa motivasi: berhenti di pesan. Satu motivasi: berhenti di motivasi itu. Lebih dari satu: lanjut berputar.
      if(!S2.length&&!TY.mv&&TY.cur===TY.msg){TY.ph='idle';TY.done=true;}
      else if(S2.length===1&&TY.mv&&TY.cur===S2[0]){TY.ph='idle';TY.done=true;}
      else{TY.ph='del';TY.done=false;tyGo(0);}
      break;
    case 'del':
      if(TY.c>0){TY.c--;tyGo(22);break;}
      if(S2.length){if(TY.i>=S2.length){TY.sents=tyShuf(TY.src,TY.cur);TY.i=0;}TY.cur=TY.sents[TY.i++];TY.mv=true;}else{TY.cur=TY.msg;TY.mv=false;}
      TY.ph='type';tyGo(350);break;
    case 'type':
      if(TY.c<TY.cur.length){TY.c++;tyGo(50);break;}
      TY.ph='hold';tyGo(TY.mv?Math.max(2800,TY.cur.length*70):1800);break;
  }
  paintGreet();
}
// Dipanggil saat template aktif / isinya berubah: perbarui daftar motivasi tanpa mengulang ketikan sapaan
function tySync(){
  if(TY.key==null)return;
  const s=tySents();if(JSON.stringify(s)===JSON.stringify(TY.src))return;
  TY.src=s;TY.sents=tyShuf(s);TY.i=0;
  if(RM()){tyStatic();paintGreet();return;}
  if(TY.ph==='idle'){TY.ph='hold';TY.done=false;tyGo(600);}
}

/* ═════════════ Jadwal & goal ═════════════ */
function sched(hb,y,m,d){
  const t=new Date(y,m,d),f=hb.f;
  if(hb.start&&t<parseD(hb.start))return false;
  const wk=Math.floor((d-1)/7)+1;
  if(f.weeks&&f.weeks.length&&!f.weeks.includes(wk))return false;
  if(f.days&&f.days.length&&!f.days.includes(t.getDay()))return false;
  if(f.type==='everyN'){const s=hb.start?parseD(hb.start):new Date(2000,0,1);return Math.round((t-s)/864e5)%Math.max(1,f.n)===0;}
  return true;
}
function goalRange(hb,y,m,a,b){
  const f=hb.f,N=dim(y,m);
  if(hb.goal&&a===1&&b===N)return hb.goal;
  const sd=[];for(let d=a;d<=b;d++)if(sched(hb,y,m,d))sd.push(d);
  if(f.type==='perWeek'){let g=0;for(let w=0;w<5;w++)g+=Math.min(f.n,sd.filter(d=>Math.floor((d-1)/7)===w).length);return g;}
  if(f.type==='perMonth'){let full=0;for(let d=1;d<=N;d++)if(sched(hb,y,m,d))full++;const tot=Math.min(f.n,full);if(a===1&&b===N)return tot;return Math.min(sd.length,Math.ceil(tot*sd.length/Math.max(1,full)));}
  return sd.length;
}
function countRange(hb,y,m,a,b){let c=0;for(let d=a;d<=b;d++)if(sched(hb,y,m,d)&&isOn(y,m,hb.id,d))c++;return c;}
// Hari terakhir yang sudah lewat di bulan itu (99 = bulan lampau, 0 = bulan depan)
function lastDay(y,m){const T=today();return (y<T.y||(y===T.y&&m<T.m))?99:(y===T.y&&m===T.m?T.d:0);}

function monthCalc(y,m){
  const M=month(y,m),H=M?M.habits:[],n=dim(y,m);
  const rows=H.map((hb,i)=>{let count=0;const cells=[];
    for(let d=1;d<=n;d++){const sc=sched(hb,y,m,d),on=sc&&isOn(y,m,hb.id,d);if(on)count++;cells.push({sc,on});}
    const goal=goalRange(hb,y,m,1,n),pct=goal?Math.min(100,Math.round(count/goal*100)):0;
    return {hb,i:i+1,cells,count,goal,pct};});
  const days=[];let total=0,goalSum=0;
  rows.forEach(r=>{total+=Math.min(r.count,r.goal);goalSum+=r.goal;});
  for(let d=1;d<=n;d++){let c=0,sc=0;rows.forEach(r=>{const x=r.cells[d-1];if(x.sc)sc++;if(x.on)c++;});
    days.push({d,c,sc,pct:sc?Math.round(c/sc*100):0,mood:moodOf(y,m,d),hasJ:!!jOf(dkey(y,m,d))});}
  const top=[...rows].sort((a,b)=>b.pct-a.pct||b.count-a.count).slice(0,10);
  return {n,rows,days,total,goalSum,p:goalSum?total/goalSum:0,top};
}

/* ═════════════ Antrean simpan (optimistic UI, digabung jadi satu panggilan) ═════════════ */
const Q={ops:new Map(),inflight:null,timer:null,tries:0,failed:false};
function enqueue(key,op,delay){Q.ops.set(key,op);if(Q.failed){Q.failed=false;Q.tries=0;}schedule(delay);refreshInd();}
function schedule(delay=1200){clearTimeout(Q.timer);Q.timer=setTimeout(()=>{Q.timer=null;flush();},delay);}
async function flush(){
  if(Q.inflight||!Q.ops.size)return;
  clearTimeout(Q.timer);Q.timer=null;
  const batch=[...Q.ops.entries()];Q.ops.clear();Q.inflight=new Set(batch.map(b=>b[0]));render();
  try{
    const r=await call('applyOps',batch.map(b=>b[1]));
    Q.inflight=null;Q.tries=0;Q.failed=false;S.lastModified=r&&r.savedAt||Date.now();
  }catch(e){
    Q.inflight=null;
    const merged=new Map();batch.forEach(([k,op])=>{if(!Q.ops.has(k))merged.set(k,op);});Q.ops.forEach((op,k)=>merged.set(k,op));Q.ops=merged;
    Q.tries++;if(Q.tries>=3)Q.failed=true;else schedule(1500*Q.tries);
  }
  render();
  if(Q.ops.size&&!Q.failed&&!Q.timer)schedule();
}
function retryNow(){Q.failed=false;Q.tries=0;flush();}
function cellState(key){if(Q.inflight&&Q.inflight.has(key))return 'saving';if(Q.ops.has(key))return Q.failed?'failed':Q.tries>0?'pending':'';return '';}
function saveState(){return Q.failed?'failed':Q.inflight?'saving':Q.ops.size?(Q.tries>0?'pending':'saving'):'';}
function indHtml(compact){
  const st=saveState();
  // HP: ikon awan dengan titik status; ketuk saat gagal = coba lagi
  if(compact){const lb={failed:tr('Gagal menyimpan · ketuk untuk coba lagi'),saving:tr('Menyimpan…'),pending:tr('Belum tersimpan · {n} perubahan',{n:Q.ops.size}),'':tr('Tersimpan ke Google Sheet')}[st];
    return `<button class="cloud ${st}" ${st==='failed'?'data-a="retry"':'data-a="noop"'} title="${lb}" aria-label="${lb}">${SVG(IC.cloud,22,1.8)}<b></b></button>`;}
  if(st==='failed')return `<span class="ind failed"><i></i>${tr('Gagal menyimpan')} · <button data-a="retry">${tr('Coba lagi')}</button></span>`;
  if(st==='saving')return `<span class="ind saving"><i></i>${tr('Menyimpan…')}</span>`;
  if(st==='pending')return `<span class="ind pending"><i></i>${tr('Belum tersimpan · {n} perubahan',{n:Q.ops.size})}</span>`;
  return `<span class="ind" title="${tr('Tersimpan ke Google Sheet')}"><i></i>${tr('Tersimpan')}</span>`;
}

/* ═════════════ Undo / redo ═════════════ */
// Tiap langkah menyimpan potret bulan (habit, centang, mood) + jurnal terkait sebelum & sesudah perubahan.
// Undo/redo memulihkan potret itu lalu mengantrekan selisihnya ke Sheet lewat antrean simpan yang sama.
const H={u:[],r:[]},H_MAX=50;
const snapM=(y,m)=>{const M=month(y,m);return M?JSON.parse(JSON.stringify({habits:M.habits,checks:M.checks,mood:M.mood})):null;};
function record(label,months,fn,jkeys=[]){
  const take=()=>({m:months.map(([y,m])=>[y,m,snapM(y,m)]),j:jkeys.map(k=>[k,jOf(k)])});
  const before=take();fn();const after=take();
  if(JSON.stringify(before)===JSON.stringify(after))return;
  H.u.push({label,before,after});if(H.u.length>H_MAX)H.u.shift();H.r=[];
}
// Op dipindah ke akhir antrean supaya urutannya benar (habit dipulihkan dulu, baru centangnya).
function enqueueLast(key,op,delay){Q.ops.delete(key);enqueue(key,op,delay);}
function restoreTo(st){
  st.m.forEach(([y,m,t])=>{const M=month(y,m);if(!M||!t)return;
    if(JSON.stringify(M.habits)!==JSON.stringify(t.habits)){M.habits=t.habits;
      enqueueLast(`h:${y}-${m}`,{t:'habits',y,m,habits:t.habits.map(h=>({id:h.id,name:h.name,f:h.f,goal:h.goal||null,start:h.start||''}))});}
    const old=M.checks;M.checks={};
    t.habits.forEach(h=>{const a=t.checks[h.id]||Array(31).fill(false),b=old[h.id]||[];M.checks[h.id]=a;
      a.forEach((v,i)=>{if(!!v!==!!b[i])enqueueLast(`c:${y}-${m}-${h.id}-${i+1}`,{t:'check',y,m,id:h.id,d:i+1,v:!!v});});});
    t.mood.forEach((v,i)=>{if(v!==M.mood[i]){M.mood[i]=v;enqueueLast(`mo:${y}-${m}-${i+1}`,{t:'mood',y,m,d:i+1,v});}});
  });
  st.j.forEach(([k,txt])=>{if(txt===jOf(k))return;const Y=S.cache[+k.slice(0,4)];if(!Y)return;
    if(txt)Y.journal[k]=txt;else delete Y.journal[k];enqueueLast('j:'+k,{t:'journal',date:k,text:txt},300);});
  const f=st.m[0];if(f){S.y=f[0];S.m=f[1];}
}
function undo(){const e=H.u.pop();if(!e){toast(tr('Tidak ada yang bisa dibatalkan'));return;}restoreTo(e.before);H.r.push(e);toast(tr('Dibatalkan: {a}',{a:e.label}));}
function redo(){const e=H.r.pop();if(!e){toast(tr('Tidak ada yang bisa diulang'));return;}restoreTo(e.after);H.u.push(e);toast(tr('Diulang: {a}',{a:e.label}));}
function stepMonth(dir){let y=S.y,m=S.m+dir;if(m<0){m=11;y--;}else if(m>11){m=0;y++;}if(!S.years.includes(y))return;S.y=y;S.m=m;render();}
async function saveNow(){
  if(!Q.ops.size&&!Q.inflight){toast(tr('Semua perubahan sudah tersimpan'));return;}
  if(Q.failed){retryNow();return;}
  await flushNow();if(!Q.ops.size&&!Q.failed)toast(tr('Tersimpan ke Google Sheet'));
}

    [[c,'S'],tr('Simpan sekarang')],[['←','→'],tr('Bulan sebelumnya / berikutnya')],[['?'],tr('Tampilkan pintasan ini')],[['Esc'],tr('Tutup jendela atau menu')]];
  return wrapModal(`<div class="phead"><h2>${tr('Pintasan keyboard')}</h2>${xBtn()}</div>
    <div style="padding:16px 20px 22px;display:flex;flex-direction:column;gap:10px">${rows.map(([ks,l])=>`<div class="row" style="justify-content:space-between;gap:16px;font-size:14px"><span>${l}</span><span class="row" style="gap:4px;flex:none">${ks.map(x=>`<kbd class="kbd">${x}</kbd>`).join('')}</span></div>`).join('')}

}
function toast(s){clearTimeout(toastT);S.toast=s;render();toastT=setTimeout(()=>{S.toast='';render();},2800);}

/* ═════════════ Render ═════════════ */
function render(){
  const a=document.activeElement,fid=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd;
  const scr={};document.querySelectorAll('[data-keep]').forEach(e=>scr[e.dataset.keep]=e.scrollTop);
  applyLang();
  document.documentElement.dataset.theme=S.settings.theme==='dark'?'dark':'light';
  document.documentElement.lang=S.settings.lang==='en'?'en':'id';
  $app.innerHTML=pageHtml()+menuHtml()+modalHtml()+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
  document.querySelectorAll('[data-keep]').forEach(e=>{if(scr[e.dataset.keep])e.scrollTop=scr[e.dataset.keep];});
  const m7=document.querySelector('[data-m7]');
  if(m7){const sl=m7.querySelector('.sl');if(sl)m7.scrollLeft=(+m7.dataset.m7)*sl.offsetWidth;}
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se);}catch(e){}}}
}
function pageHtml(){
  if(!S.ready)return S.error
    ?`<div class="center" style="min-height:100vh;padding:24px"><b style="font-size:20px">${tr('Aplikasi gagal dimuat')}</b><span class="muted" style="max-width:420px">${esc(S.error)}</span><span class="muted" style="font-size:13px;max-width:420px">${tr('Pastikan kamu masuk dengan akun Google pemilik salinan sheet, lalu coba lagi.')}</span><button class="btn g" data-a="init">${tr('Coba lagi')}</button></div>`
    :`<div class="center" style="min-height:100vh"><div class="spin"></div><span class="muted" style="font-size:13px">${tr('Memuat Habit Builder…')}</span></div>`;
  if(S.page==='journal')return viewJournal();
  if(S.page==='stats')return viewStats();
  if(S.page==='motiv')return viewMotiv();
  if(S.page==='settings')return viewSettings();
  return viewDash();
}
const hamHtml=()=>`<button class="ham" data-a="menu" aria-label="Menu" title="Menu">${SVG(IC.menu)}</button>`;
// Header semua halaman (laptop 72px, HP 56px): ☰ + judul + isi kanan
const topbar=(title,right)=>`<div class="topbar">${hamHtml()}<h1>${esc(title)}</h1>${right||''}</div>`;
const loadingBlock=()=>`<div class="center" style="padding:80px 0"><div class="spin"></div></div>`;
function yearOptions(sel,withAdd){return S.years.map(v=>`<option value="${v}"${v===sel?' selected':''}>${v}</option>`).join('')+(S.years.includes(sel)?'':`<option value="${sel}" selected>${sel}</option>`)+(withAdd?`<option value="add">${tr('+ Tambah tahun')}</option>`:'');}
function monthOptions(sel,short,idn){return (idn?MID:MONTHS).map((x,i)=>`<option value="${i}"${i===sel?' selected':''}>${short?x.slice(0,3):x}</option>`).join('');}
function moodChip(s){if(!s)return `<span class="chip" style="background:var(--line)">${tr('Mood –')}</span>`;const [bg,fg]=moodC(s);return `<span class="chip" style="background:${bg};color:${fg}">${esc(moodLbl(s))}</span>`;}
// Lebih dari 5 skor → dua baris supaya label tetap terbaca di HP
function moodGrid(cur,act,extra=''){const N=moodN();return `<div class="moodgrid" style="grid-template-columns:repeat(${N<=5?N:Math.ceil(N/2)},1fr)">${moodRange().map(v=>{const on=cur===v,[bg,fg]=moodC(v);return `<button data-a="${act}" data-v="${v}" ${extra} style="${on?`background:${bg};color:${fg};border:2px solid var(--fg)`:''}"><b>${v}</b><span>${esc(ML(v))}</span></button>`;}).join('')}</div>`;}

/* ── Dashboard ── */
function viewDash(){
  const {y}=S;
  if(!S.years.includes(y))return dashHead()+yearMissing(y);
  if(!S.cache[y]){ensureYear(y);return dashHead()+loadingBlock();}
  return dashHead()+(isMobile()?dashMobile():dashDesktop());
}
// Laptop: status simpan berupa pil; HP: ikon awan. Bulan HP pakai singkatan Indonesia.
function dashHead(){
  const mob=isMobile();
  return topbar(t('dashT'),`<div class="sp hide-m"></div>${mob?`<span data-ind="c">${indHtml(true)}</span>`:`<span data-ind>${indHtml()}</span>`}
    <div class="row" style="gap:${mob?4:8}px"><select class="hsel" data-c="month" aria-label="${tr('Bulan')}">${monthOptions(S.m,true,mob)}</select><select class="hsel" data-c="year" aria-label="${tr('Tahun')}" style="width:${mob?70:100}px">${yearOptions(S.y,true)}</select></div>`);
}
function yearMissing(y){
  const prev=[...S.years].reverse().find(v=>v<y)||S.years[S.years.length-1],mob=isMobile();
  return `<div class="center" style="padding:${mob?'90px 20px':'70px 24px'}">
    <div style="font-weight:800;font-size:72px;letter-spacing:.06em;color:transparent;-webkit-text-stroke:2px var(--fg);line-height:1">${y}</div>
    <div style="font-weight:800;font-size:24px">${tr('Lembar {y} belum ada',{y})}</div>
    <div class="muted" style="max-width:380px;font-size:14px;line-height:1.5">${tr('Buat lembar {y} untuk mulai mencatat. 12 bulan (Januari–Desember) dibuat sekaligus.',{y})}${prev?tr(' Data {p} tetap aman.',{p:prev}):''}</div>
    <div style="display:flex;gap:10px;${mob?'flex-direction:column;align-self:stretch':''}"><button class="btn g lg" data-a="createYear" data-y="${y}">${tr('Buat lembar {y}',{y})}</button>${prev&&prev!==y?`<button class="btn lg" data-a="goYear" data-y="${prev}">${tr('Lihat {p}',{p:prev})}</button>`:''}</div>
  </div>`;
}
// Data yang dipakai bersama oleh dashboard laptop (1a) dan HP (7a)
function dashCtx(){
  const {y,m}=S,C=monthCalc(y,m),T=today(),isCur=y===T.y&&m===T.m,ym=`${y}-${m}`;
  const latest=[...C.days].reverse().find(x=>x.hasJ);
  const jd=S.jSel[ym]!=null?S.jSel[ym]:(latest?latest.d:null);
  const hasHabits=C.rows.length>0,copySrc=hasHabits?null:findCopySource(y,m);
  return {C,T,isCur,ym,ld:lastDay(y,m),jd,hasHabits,copySrc,showCopy:!!copySrc&&!S.skipCopy[ym],
    dec:T.m===11&&y===T.y&&!S.years.includes(T.y+1)&&!snoozed(),deg:(Math.min(1,C.p)*360).toFixed(1)};
}
function cellHtml(r,d,cls=''){
  const {y,m}=S,c=r.cells[d-1];
  if(!c.sc)return `<div class="cell off${cls}" title="${tr('Tidak dijadwalkan')}"><div class="box">–</div></div>`;
  const st=cellState(`c:${y}-${m}-${r.hb.id}-${d}`);
  return `<div class="cell${cls}${st?' '+st:''}" data-a="cell" data-id="${r.hb.id}" data-d="${d}"${st==='failed'?` title="${tr('Gagal menyimpan. Ketuk untuk coba lagi.')}"`:''}><div class="box${c.on?' on':''}">${c.on?'✓':''}</div></div>`;
}
const moodCell=(x,cls,style='')=>{const {m}=S,st=cellState(`mo:${S.y}-${m}-${x.d}`);
  const [bg,fg]=x.mood?moodC(x.mood):['var(--bg)','var(--fg)'];
  return `<div class="${cls}" title="${tr('Pilih mood {d} {m}',{d:x.d,m:MID[m]})}${x.mood&&ML(x.mood)?' · '+esc(ML(x.mood)):''}" style="background:${bg};color:${fg};${st==='saving'?'opacity:.5;':''}${style}">${x.mood||''}<select class="msel" data-c="moodSel" data-d="${x.d}" aria-label="Mood ${x.d} ${MID[m]}">${optsHtml(MOOD_CELL(),x.mood)}</select></div>`;};
const jIcon=(x,jd)=>x.hasJ?(x.d===jd?envOpen():envClosed()):'';
const moodLegend=()=>`<span><i style="height:2.5px;width:14px;background:var(--fg)"></i>${tr('skor mood')}</span><span><i style="height:2px;width:14px;background:var(--green)"></i>${tr('% habit harian')}</span><span><b style="background:var(--fg);padding:2px 3px;display:flex">${envClosed(14)}</b>${tr('ada jurnal')}</span><span><b style="background:var(--fg);padding:1px 3px;display:flex">${envOpen(14)}</b>${tr('sedang dibuka')}</span><span>${tr('skor')} ${moodRange().map(v=>{const [bg,fg]=moodC(v);return `<b title="${esc(moodLbl(v))}" style="padding:0 5px;background:${bg};color:${fg};font-weight:400">${v}</b>`;}).join('')}</span><span>${tr('· klik skor = pilih mood')}</span>`;

function journalCard(X,mob){
  const {y,m}=S,{jd,isCur}=X;
  if(!jd)return `<div class="center" style="flex:1;gap:10px"><b>${tr('Belum ada jurnal bulan ini')}</b><span class="muted" style="font-size:13px">${tr('Tulis 1–2 kalimat tentang hari ini. Cukup 30 detik.')}</span><button class="btn" data-a="jWrite">${tr(isCur?'Tulis jurnal hari ini':'Tulis jurnal')}</button></div>`;
  const k=dkey(y,m,jd),s=moodOf(y,m,jd),n=dim(y,m);
  // Mode "jurnal baru": tanggal jadi pemilih tanggal (terbatas bulan ini) supaya bisa diganti
  const date=S.jNew===X.ym
    ?`<input type="date" class="sel" data-c="jNewDate" value="${k}" min="${dkey(y,m,1)}" max="${dkey(y,m,n)}" aria-label="${tr('Tanggal jurnal baru')}" style="flex:1;min-width:0;height:28px;padding:0 4px;font-size:${mob?11:12}px;background:var(--card)">`

  const btn=S.jNew===X.ym?`<button class="jadd" data-a="jNewCancel" title="${tr('Batal')}" aria-label="${tr('Batal tulis jurnal baru')}">×</button>`:`<button class="jadd" data-a="jNewDash" title="${tr('Tulis jurnal baru')}" aria-label="${tr('Tulis jurnal baru')}">+</button>`;

    <textarea id="jt-${mob?'m':'dash'}" data-i="journal" data-k="${k}" placeholder="${JPH}" style="flex:1;resize:none;border:1px dashed #999;background:var(--bg);padding:${mob?8:10}px;font-size:${mob?13:14}px;line-height:1.5;min-height:${mob?170:220}px">${esc(jOf(k))}</textarea>
    <span class="muted" style="font-size:${mob?11:12}px">${tr(cellState('j:'+k)==='saving'?'Menyimpan…':'Tersimpan otomatis')}</span>`;

function dashDesktop(){
  const X=dashCtx(),{y,m}=S,{C,T,isCur,ld,jd}=X,{n,rows,days}=C;
  const sep=i=>i>0&&i%7===0?' sep':'';
  const weeks=[];for(let w=0;w<Math.ceil(n/7);w++){const c=Math.min(7,n-w*7);weeks.push(`<div style="width:${c*CW}px">${c<3?'W':'WEEK '}${w+1}</div>`);}
  const wkRow=`<div class="wk">${weeks.join('')}</div>`;
  const iniRow=`<div class="dr">${days.map((x,i)=>`<div class="${sep(i)}">${INI[new Date(y,m,x.d).getDay()]}</div>`).join('')}</div>`;
  const numRow=(circle)=>`<div class="dr num" style="border-bottom:1px solid var(--fg)">${days.map((x,i)=>`<div class="${sep(i)}">${circle?`<span class="dnum${isCur&&x.d===T.d?' today':''}">${x.d}</span>`:x.d}</div>`).join('')}</div>`;
  // Grafik mood & % habit harian
  const pathFor=(vals,H,min,max)=>smooth(vals.map((v,i)=>v==null?null:[i*CW+CW/2,+(H-12-(v-min)/(max-min)*(H-24)).toFixed(1)]).filter(Boolean));
  const moodPath=pathFor(days.map(x=>x.mood||null),130,1,Math.max(2,moodN()));
  const habPath=X.hasHabits?pathFor(days.map(x=>x.d<=ld?x.pct:null),130,0,100):'';

    ?rows.map(r=>`<div class="grow">${r.cells.map((c,i)=>cellHtml(r,i+1,sep(i))).join('')}</div>`).join('')

    <div style="font-weight:800;font-size:32px;letter-spacing:.1em;line-height:1">${MONTHS[m].toUpperCase()}</div>
    <div style="margin-top:10px;padding-top:12px;border-top:1px dashed var(--chipb)">${greetHtml([30,22,6])}</div>
  </div>
  <div style="display:flex;flex-direction:column">
    <div style="text-align:center;font-weight:700;font-size:12px;letter-spacing:.3em;padding-bottom:8px;border-bottom:1px solid var(--fg)">DAILY PERCENTAGE PROGRESS</div>
    <div style="display:flex;align-items:flex-end;height:150px;border-bottom:1.5px solid var(--fg)">${days.map(x=>`<div class="bar" style="height:100%;align-items:flex-end"><div style="width:18px;height:${Math.round(x.pct*1.4)}px;background:var(--fg);transition:height .2s"></div></div>`).join('')}</div>
    <div style="display:flex;height:22px">${days.map(x=>`<div class="dl" style="font-size:9px;font-weight:600">${x.pct}%</div>`).join('')}</div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg);padding:0 4px">
    <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;letter-spacing:.25em">PROGRESS</span><span style="font-weight:800;font-size:30px">${X.hasHabits?comma((C.p*100).toFixed(1))+'%':'–'}</span></div>

function findCopySource(y,m){
  for(let k=m-1;k>=0;k--){const M=month(y,k);if(M&&M.habits.length)return {y,m:k,habits:M.habits};}
  const prevY=[...S.years].reverse().find(v=>v<y);
  if(prevY!=null){if(!S.cache[prevY]){ensureYear(prevY);return null;}for(let k=11;k>=0;k--){const M=month(prevY,k);if(M.habits.length)return {y:prevY,m:k,habits:M.habits};}}
  return null;
}

  }
  if(!S.cache[JY]){ensureYear(JY);return `${top()}${loadingBlock()}`;}
  const J=S.cache[JY].journal,lastM=JY===T.y?T.m:(JY<T.y?11:-1),groups=[];let total=0,first=null;
  for(let m=11;m>=0;m--){

    if(items.length||m<=lastM)groups.push({m,items});

    ${g.items.length?g.items.map(d=>{const k=dkey(JY,g.m,d),s=moodOf(JY,g.m,d);return `<button class="jcard${k===sel&&!mobile?' on':''}" data-a="jPick" data-k="${k}"><span class="d"><b>${d}</b><span>${DAYID[new Date(JY,g.m,d).getDay()]}</span></span><span style="display:flex;flex-direction:column;gap:5px;min-width:0">${moodChip(s)}<span class="tx">${esc(J[k])}</span></span></button>`;}).join('')

    :`<div class="center" style="padding:60px 10px"><b>${tr('Belum ada jurnal di {y}',{y:JY})}</b><span class="muted" style="font-size:13px">${tr('Jurnal yang ditulis di tahun ini muncul di sini.')}</span></div>`;

  const todayCard=JY===T.y&&!J[dkey(T.y,T.m,T.d)]?`<button class="jtoday" data-a="jToday"><span style="display:flex;flex-direction:column;gap:2px"><b style="font-size:13px">${tr('Hari ini')} · ${DAYID[new Date(T.y,T.m,T.d).getDay()]}, ${T.d} ${MID[T.m]}</b><span class="muted" style="font-size:12px">${tr('Belum ada jurnal')}</span></span><span class="btn g" style="height:36px;padding:0 12px;display:flex;align-items:center">${tr('+ Tulis jurnal')}</span></button>`:'';
  return `${top(total)}

/* ── Statistik (3b/5f) ── */
function yearStats(Y){
  const per={},order=[],mon=Array.from({length:12},()=>({sel:0,tgt:0}));
  for(let m=0;m<12;m++){
    const ld=lastDay(Y,m);if(!ld)continue;const n=dim(Y,m),upto=Math.min(n,ld);
    month(Y,m).habits.forEach(hb=>{
      if(!per[hb.id]){per[hb.id]={name:hb.name,f:hb.f,sel:0,tgt:0,months:Array(12).fill(null),active:0};order.push(hb.id);}
      let g=upto===n?goalRange(hb,Y,m,1,n):(hb.goal?Math.max(1,Math.round(hb.goal*upto/n)):goalRange(hb,Y,m,1,upto));
      if(!g)return;
      const c=Math.min(g,countRange(hb,Y,m,1,upto)),P=per[hb.id];
      P.name=hb.name;P.f=hb.f;P.sel+=c;P.tgt+=g;P.months[m]=c/g;P.active++;mon[m].sel+=c;mon[m].tgt+=g;
    });
  }
  const moodAvg=[];let ms=0,mc=0;
  for(let m=0;m<12;m++){let s=0,c=0;const M=month(Y,m);for(let d=1;d<=dim(Y,m);d++){const v=moodOf(Y,m,d);if(v){s+=v;c++;}}moodAvg.push(c?s/c:null);ms+=s;mc+=c;}
  const habits=order.map(id=>({id,...per[id]}));
  const totSel=habits.reduce((a,h)=>a+h.sel,0),totTgt=habits.reduce((a,h)=>a+h.tgt,0);
  return {habits,mon,moodAvg,totSel,totTgt,moodYear:mc?ms/mc:null};
}

function openQI(y,m,d){
  let draft=null;try{draft=JSON.parse(localStorage.getItem('hb-qi-draft'));}catch(e){}
  S.modal={type:'qi',y,m,d,checks:{},mood:0,journal:'',err:'',busy:false,draft,loaded:false};
  loadQI();
}
function fillQI(q){
  if(!S.years.includes(q.y)||!S.cache[q.y]){q.loaded=false;ensureYear(q.y);return;}
  q.checks={};month(q.y,q.m).habits.forEach(hb=>{if(sched(hb,q.y,q.m,q.d))q.checks[hb.id]=isOn(q.y,q.m,hb.id,q.d);});
  q.mood=moodOf(q.y,q.m,q.d);q.journal=jOf(dkey(q.y,q.m,q.d));q.loaded=true;q.err='';
}
function loadQI(){const q=S.modal;if(q&&q.type==='qi'){fillQI(q);render();}}
function qiHtml(q){
  if(!q.loaded&&S.cache[q.y]&&S.years.includes(q.y))fillQI(q);
  const T=today(),isT=q.y===T.y&&q.m===T.m&&q.d===T.d,lock=q.err||q.busy?' style="opacity:.55;pointer-events:none"':'';
  let body;
  if(!S.years.includes(q.y))body=`<div class="center" style="padding:30px 20px"><b>${tr('Lembar {y} belum ada',{y:q.y})}</b><button class="btn g" data-a="createYear" data-y="${q.y}">${tr('Buat lembar {y}',{y:q.y})}</button></div>`;
  else if(!q.loaded)body=loadingBlock();
  else{
    const H=month(q.y,q.m).habits,sh=H.filter(hb=>hb.id in q.checks),done=sh.filter(hb=>q.checks[hb.id]).length;
    body=`<div${lock}>
      ${q.draft&&!q.err?`<div class="row" style="gap:10px;margin:12px 16px 0;padding:10px 12px;border:1.5px dashed var(--fg);border-radius:8px;font-size:13px"><span class="sp">${tr('Ada draft {d} {m} yang belum tersimpan.',{d:q.draft.d,m:MID[q.draft.m].slice(0,3)})}</span><button class="linkbtn" data-a="qiDraft">${tr('Lanjutkan draft')}</button><button class="linkbtn muted" data-a="qiDraftDrop">${tr('Buang')}</button></div>`:''}
      <div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:8px">
      ${sh.length?`<div class="prog"><div><div style="width:${Math.round(done/sh.length*100)}%"></div></div><b style="font-size:14px">${done}/${sh.length}</b></div>`:''}
      <div>${sh.length?sh.map(hb=>`<button class="qrow" data-a="qiCheck" data-id="${hb.id}"><span class="sp" style="font-size:15px">${esc(hb.name)}</span><span class="muted" style="font-size:11px;white-space:nowrap">${esc(freqLabel(hb.f).split(' · ')[0])}</span><span class="qbox${q.checks[hb.id]?' on':''}">${q.checks[hb.id]?'✓':''}</span></button>`).join(''):`<div class="muted" style="font-size:13px;padding:8px 4px">${tr(H.length?'Tidak ada habit yang dijadwalkan di tanggal ini.':'Belum ada habit. Mood & jurnal tetap bisa diisi.')}</div>`}</div>
      ${H.length>sh.length&&sh.length?`<div class="muted" style="font-size:12px">${tr('{n} habit tidak dijadwalkan di tanggal ini',{n:H.length-sh.length})}</div>`:''}
      <div class="lbl" style="margin-top:14px">${tr(isT?'MOOD HARI INI':'MOOD')}</div>
      ${moodGrid(q.mood,'qiMood')}
      <div class="lbl" style="margin-top:14px">${tr(isT?'JURNAL HARI INI':'JURNAL')}</div>
      <textarea id="qi-j" data-i="qiJ" placeholder="${JPH}" style="width:100%;height:96px;resize:none;border:1.5px solid var(--fg);border-radius:8px;background:var(--card);padding:10px;font-size:14px;line-height:1.5">${esc(q.journal)}</textarea>
    </div></div>
    ${q.err?`<div class="err" style="margin:12px 16px 0;background:var(--redbg);border-color:var(--red);color:var(--redfg)"><b>${tr('Gagal menyimpan. Coba lagi.')}</b><br>${tr('Isian kamu tidak hilang. Periksa koneksi internet.')}</div>`:''}
    <div class="row" style="gap:10px;padding:14px 16px 20px">${q.err?`<button class="btn lg" data-a="qiCloseDraft">${tr('Tutup')}</button><button class="btn g lg sp" data-a="qiSave">${tr('Coba lagi')}</button>`
      :`<button class="btn g lg sp" data-a="qiSave" ${q.busy?'disabled':''}>${tr(q.busy?'Menyimpan…':'Simpan')}</button>`}</div>`;
  }
  return wrapModal(`<div class="phead" style="padding:6px 8px 6px 20px"><h2>${tr('Input cepat')}</h2>${xBtn()}</div>
    <div class="row" style="justify-content:space-between;padding:2px 8px;border-bottom:1px solid var(--line)"><button class="x" style="width:44px;height:44px;font-size:20px;font-weight:700" data-a="qiShift" data-v="-1" aria-label="${tr('Hari sebelumnya')}">‹</button><b style="font-size:15px;text-align:center">${isT?tr('Hari ini · '):''}${DAYID[new Date(q.y,q.m,q.d).getDay()]}, ${q.d} ${MID[q.m]} ${q.y}</b><button class="x" style="width:44px;height:44px;font-size:20px;font-weight:700" data-a="qiShift" data-v="1" aria-label="${tr('Hari berikutnya')}">›</button></div>
    ${body}`,440);
}
async function qiSave(){
  const q=S.modal;if(!q||q.busy)return;
  const {y,m,d}=q,k=dkey(y,m,d),ops=[];
  Object.keys(q.checks).forEach(id=>ops.push({t:'check',y,m,id,d,v:!!q.checks[id]}));
  ops.push({t:'mood',y,m,d,v:q.mood||0});
  if(q.journal!==jOf(k))ops.push({t:'journal',date:k,text:q.journal.trim()?q.journal:''});
  // Perubahan yang masih antre ikut dikirim lebih dulu dalam panggilan yang sama.
  const pending=[...Q.ops.entries()];Q.ops.clear();clearTimeout(Q.timer);
  q.busy=true;q.err='';render();
  try{
    await call('applyOps',[...pending.map(p=>p[1]),...ops]);
    const M=month(y,m);
    record(tr('Input cepat {d} {m}',{d,m:MID[m]}),[[y,m]],()=>{
      Object.keys(q.checks).forEach(id=>{(M.checks[id]=M.checks[id]||Array(31).fill(false))[d-1]=!!q.checks[id];});
      M.mood[d-1]=q.mood||0;if(q.journal.trim())S.cache[y].journal[k]=q.journal;else delete S.cache[y].journal[k];},[k]);
    try{localStorage.removeItem('hb-qi-draft');}catch(e){}
    S.modal=null;S.y=y;S.m=m;if(q.journal.trim())S.jSel[`${y}-${m}`]=d;S.lastModified=Date.now();
    toast(tr('Tersimpan · dashboard diperbarui'));
  }catch(e){
    const merged=new Map(pending);Q.ops.forEach((op,key)=>merged.set(key,op));Q.ops=merged;if(Q.ops.size)schedule(4000);
    q.busy=false;q.err=msg(e);render();
  }
}

/* Form habit: Tambah (2d/5i) & Detail (4b/5h) */
function newDraft(name){const T=today();return {name:name||'',type:'daily',nE:2,nW:3,nM:12,days:[],weeks:[],start:S.y===T.y&&S.m===T.m?dkey(T.y,T.m,T.d):'',goalManual:false,goalVal:0};}
function habitToDraft(h){const f=h.f;return {name:h.name,type:f.type,nE:f.type==='everyN'?f.n:2,nW:f.type==='perWeek'?f.n:3,nM:f.type==='perMonth'?f.n:12,days:[...(f.days||[])],weeks:[...(f.weeks||[])],start:h.start||'',goalManual:!!h.goal,goalVal:h.goal||0};}
function draftToHabit(dr,base){
  const n=dr.type==='everyN'?dr.nE:dr.type==='perWeek'?dr.nW:dr.type==='perMonth'?dr.nM:null;
  const f={type:dr.type,days:[...dr.days],weeks:[...dr.weeks]};if(n!=null)f.n=Math.max(1,+n||1);
  return {...base,name:dr.name.trim(),f,start:dr.start||'',goal:null};
}
function freqForm(dr,mobile){
  const fr=[['daily',null,tr('Setiap hari')],['everyN','nE',tr('hari sekali')],['perWeek','nW',tr('kali seminggu')],['perMonth','nM',tr('kali sebulan')]];
  const tg=(arr,act,items)=>`<div class="tg">${items.map(([v,l])=>`<button class="${arr.includes(v)?'on':''}" data-a="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;
  // Satu kolom (Detail habit & HP) memakai label ringkas seperti 4b/5i
  const lb=mobile?'lbl2':'lbl',sub=x=>`<span class="muted" style="font-size:${mobile?10:11}px">${tr('kosong = semua '+x)}</span>`;
  return `<div style="display:flex;flex-direction:column;gap:6px"><span class="${lb}">${tr('FREKUENSI')}</span>
    <div style="display:grid;grid-template-columns:${mobile?'1fr':'1fr 1fr'};gap:6px" class="two">${fr.map(([k,nk,post])=>`<div class="fr${dr.type===k?' on':''}" data-a="dType" data-v="${k}"><span class="radio${dr.type===k?' on':''}"><i></i></span>${nk?`<input type="number" min="1" id="dn-${k}" data-i="dN" data-k="${nk}" data-t="${k}" value="${dr[nk]}">`:''}<span>${post}</span></div>`).join('')}</div></div>
  <div style="display:flex;flex-direction:column;gap:6px"><div class="row" style="justify-content:space-between;align-items:baseline"><span class="${lb}">${tr(mobile?'HARI':'HARI APA SAJA?')}</span>${sub('hari')}</div>${tg(dr.days,'dDay',[1,2,3,4,5,6,0].map(x=>[x,DS[x]]))}</div>
  <div style="display:flex;flex-direction:column;gap:6px"><div class="row" style="justify-content:space-between;align-items:baseline"><span class="${lb}">${tr(mobile?'MINGGU KE':'MINGGU KE BERAPA?')}</span>${sub('minggu')}</div>${tg(dr.weeks,'dWeek',[1,2,3,4,5].map(x=>[x,'W'+x]))}</div>
  <div class="row" style="justify-content:space-between;gap:12px"><span class="${lb}">${tr('MULAI TANGGAL')}</span><input type="date" class="sel" id="d-start" data-c="dStart" value="${dr.start}" style="font-weight:400;background:var(--card)"></div>`;
}
function calHtml(hb,y,m,opts){
  const n=dim(y,m),lead=(new Date(y,m,1).getDay()+6)%7,T=today(),flex=(hb.f.type==='perWeek'||hb.f.type==='perMonth')&&!hb.f.days.length;
  let cells='';for(let i=0;i<lead;i++)cells+='<div></div>';
  for(let d=1;d<=n;d++){
    const s=sched(hb,y,m,d),isT=y===T.y&&m===T.m&&d===T.d;
    if(opts.preview){
      if(y===T.y&&m===T.m&&d<T.d)cells+=`<div class="past">${d}</div>`;
      else cells+=s?`<div class="k${flex?' flex':''}${isT?' today':''}">${d}</div>`:`<div class="off">${d}</div>`;
    }else{
      const c=s&&isOn(y,m,hb.id,d);
      cells+=s?`<div class="${c?'done':'k'} click" data-a="calCheck" data-d="${d}">${d}</div>`:`<div class="off">${d}</div>`;
    }
  }
  return `<div class="cal hd">${[1,2,3,4,5,6,0].map(x=>`<div>${DS[x]}</div>`).join('')}</div><div class="cal">${cells}</div>`;
}

  if(mobile)return wrapModal(`<div class="phead" style="padding:6px 8px 6px 20px"><h2>${tr('Tambah habit')}</h2>${xBtn()}</div><div style="display:flex;flex-direction:column;gap:16px;padding:18px 16px 16px">${form}</div>
    <div class="pfoot"><span class="lbl" style="font-size:10px">${tr('GOAL BULAN INI')}</span><b style="font-size:20px">${g}×</b><div class="sp"></div><button class="btn g lg${ok?'':' dis'}" data-a="addSave">${tr('Simpan habit')}</button></div>`,560);

}
function detailHtml(M){
  const {y,m}=S,mh=month(y,m),hb0=mh&&mh.habits.find(h=>h.id===M.id);
  if(!hb0){S.modal=null;return '';}
  const dr=M.draft||habitToDraft(hb0),n=dim(y,m),T=today(),ld=lastDay(y,m),mobile=isMobile();
  const tmp=draftToHabit(dr,{id:hb0.id}),auto=goalRange(tmp,y,m,1,n),goal=dr.goalManual?Math.max(1,+dr.goalVal||auto):auto;
  if(dr.goalManual)tmp.goal=goal;
  const cnt=countRange(tmp,y,m,1,n),pc=goal?Math.min(100,cnt/goal*100):0;
  const dirty=!!M.draft,ok=dirty&&dr.name.trim()!=='';
  const settings=`<div style="display:flex;flex-direction:column;gap:16px">${freqForm(dr,true)}
    <div style="background:var(--soft);border-radius:${mobile?12:10}px;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
      <div class="row" style="justify-content:space-between"><span class="lbl" style="font-size:11px">GOAL</span><div class="seg" style="background:var(--bg)"><button class="${dr.goalManual?'':'on'}" data-a="dGoalMode" data-v="auto">${tr('Otomatis')}</button><button class="${dr.goalManual?'on':''}" data-a="dGoalMode" data-v="manual">${tr('Manual')}</button></div></div>
      <div class="row" style="justify-content:space-between;gap:10px">${dr.goalManual?`<span class="row" style="gap:8px"><input type="number" min="1" class="sel" id="dt-goal" data-i="dGoal" value="${goal}" style="width:76px;height:${mobile?44:38}px;font-size:18px;font-weight:800;text-align:center"><b>×</b></span>`:`<b style="font-size:26px">${auto}×</b>`}<span class="muted" style="font-size:11px">${dr.goalManual?tr('otomatis: {n}× · hanya bulan ini',{n:auto}):tr('dihitung dari frekuensi')}</span></div>
    </div></div>`;
  // Kalender pakai jadwal draft (pratinjau); klik tanggal terjadwal = centang/batal seperti di grid
  const lead=(new Date(y,m,1).getDay()+6)%7;let cal='';for(let i=0;i<lead;i++)cal+='<div></div>';
  for(let d=1;d<=n;d++){const s=sched(tmp,y,m,d),c=s&&isOn(y,m,hb0.id,d);
    cal+=s?`<div class="click" data-a="calCheck" data-d="${d}"><span>${d}</span><i class="box${c?' on':''}">${c?'✓':''}</i></div>`:`<div class="off" title="${tr('Tidak dijadwalkan')}"><span>${d}</span><i class="box">–</i></div>`;}
  const perf=`<div style="display:flex;flex-direction:column;gap:${mobile?18:20}px">
    <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl" style="font-size:${mobile?11:12}px">PROGRESS</span><div class="prog"><div><div style="width:${pc.toFixed(0)}%"></div></div><span style="font-size:13px;white-space:nowrap"><b style="font-size:15px">${pc.toFixed(0)}%</b> <span class="muted">· ${cnt} / ${goal}</span></span></div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl" style="font-size:11px">${tr('KALENDER')}</span>
      <div class="cal2 hd">${[1,2,3,4,5,6,0].map(x=>`<span>${DS[x]}</span>`).join('')}</div><div class="cal2">${cal}</div>
      <div class="legend"><span><i class="box on" style="width:14px;height:14px;font-size:10px;line-height:11px">✓</i>${tr('selesai')}</span><span><i class="box" style="width:14px;height:14px"></i>${tr('belum')}</span><span><i class="box" style="width:14px;height:14px;border-color:var(--offb);background:var(--off);color:var(--offf);font-size:10px;line-height:11px">–</i>${tr('tidak dijadwalkan')}</span></div></div>
  </div>`;
  const delText=tr('Hapus "{name}"? {n} centang di {m} {y} ikut hilang. Bulan lain tidak berubah.',{name:esc(hb0.name),n:countRange(hb0,y,m,1,n),m:MID[m],y});
  const band=M.confirm?`<div class="delband"><span>${delText}</span><div class="row" style="gap:8px;${mobile?'width:100%':''}"><button class="btn" data-a="dDelNo">${tr('Batal')}</button><button class="btn redfill" data-a="dDelYes">${tr('Ya, hapus')}</button></div></div>`:'';

  return wrapModal(`<div class="phead" style="padding:14px 20px;gap:14px">${nameInp(24,8)}<span class="b" style="font-size:13px;color:var(--muted);white-space:nowrap">${MID[m]} ${y}</span>${xBtn()}</div>
    <div class="mgrid" style="display:grid;grid-template-columns:400px 1fr"><div style="padding:18px 20px;border-right:1px dashed var(--chipb)">${settings}</div><div style="padding:18px 20px">${perf}</div></div>
    ${band}<div class="pfoot" style="padding:14px 20px">${M.confirm?'':`<button class="linkbtn" style="color:var(--red)" data-a="dDel">${tr('Hapus habit')}</button>`}<div class="sp"></div>${M.saved&&!dirty?`<span style="color:var(--green);font-weight:700;font-size:12px">${tr('Tersimpan')}</span>`:''}<button class="btn lg" data-a="close">${tr('Batal')}</button><button class="btn g lg${ok?'':' dis'}" data-a="dSave">${tr('Simpan perubahan')}</button></div>`,1000);
}

function addYearHtml(M){
  const exists=S.years.includes(M.year);
  if(M.busy)return wrapModal(`<div class="phead"><h2>${tr('Membuat lembar {y}…',{y:M.year})}</h2></div><div style="padding:20px;display:flex;flex-direction:column;gap:10px"><div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden"><div style="height:100%;width:40%;background:var(--fg);animation:pl 1s infinite"></div></div><span class="muted" style="font-size:12px">${tr('12 bulan sedang dibuat di Google Sheet. Jangan tutup halaman ini.')}</span></div>`,420);
  const prev=[...S.years].reverse().find(v=>v<M.year);
  let src='';if(prev!=null&&S.cache[prev]){for(let k=11;k>=0;k--){const hs=month(prev,k).habits;if(hs.length){src=tr('{m} {y} ({n} habit, tanpa centang)',{m:MID[k],y:prev,n:hs.length});break;}}}
  return wrapModal(`<div class="phead"><h2>${tr('Tambah tahun')}</h2>${xBtn()}</div>
    <div style="padding:18px 20px;display:flex;flex-direction:column;gap:16px">
      <div class="row" style="justify-content:space-between"><span class="lbl">${tr('TAHUN')}</span><div class="row" style="gap:6px"><button class="btn" style="width:40px;padding:0" data-a="ayStep" data-v="-1">−</button><b style="width:80px;text-align:center;font-size:20px;border:1.5px solid var(--fg);border-radius:8px;padding:6px 0">${M.year}</b><button class="btn" style="width:40px;padding:0" data-a="ayStep" data-v="1">+</button></div></div>
      ${prev!=null?`<label class="row" style="gap:10px;font-size:14px;cursor:pointer" data-a="ayCopy"><span class="chk${M.copy?' on':''}">${M.copy?'✓':''}</span><span>${tr('Salin daftar habit dari {src} ke Januari',{src:src||tr('bulan terakhir {y}',{y:prev})})}</span></label>`:''}

/* Load dari Drive (6h) */
function loadHtml(M){
  if(M.busy)return wrapModal(`<div class="phead"><h2>${tr('Memuat dari Drive…')}</h2></div>${loadingBlock()}`,460);
  if(!M.info)return wrapModal(`<div class="phead"><h2>${tr('Load data dari Drive')}</h2>${xBtn()}</div>${loadingBlock()}`,460);
  if(!M.info.exists)return wrapModal(`<div class="phead"><h2>${tr('Load data dari Drive')}</h2>${xBtn()}</div><div style="padding:20px;font-size:14px">${tr('Belum ada data di Drive. Save dulu?')}</div><div class="pfoot"><button class="btn lg" data-a="close">${tr('Batal')}</button><button class="btn g lg sp" data-a="saveDrive">${tr('Save ke Drive')}</button></div>`,460);
  const appNewer=(M.info.appAt||0)>(M.info.driveAt||0);
  return wrapModal(`<div class="phead"><h2>${tr('Load data dari Drive?')}</h2>${xBtn()}</div>
    <div style="padding:18px 20px;display:flex;flex-direction:column;gap:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="border:1.5px solid var(--line);border-radius:8px;padding:12px"><div class="lbl" style="font-size:10px">${tr('DI APLIKASI')}</div><b>${fmtStamp(M.info.appAt)}</b><div class="muted" style="font-size:11px">${tr('terakhir diubah')}</div></div>
        <div style="border:1.5px solid var(--fg);border-radius:8px;padding:12px"><div class="lbl" style="font-size:10px">${tr('DI DRIVE')}</div><b>${fmtStamp(M.info.driveAt)}</b><div class="muted" style="font-size:11px">${tr('terakhir disimpan')}</div></div>
      </div>
      <div class="${appNewer?'err':''}" style="${appNewer?'':'background:var(--soft);border-radius:8px;padding:12px 14px;font-size:13px'}">${tr('Data di aplikasi akan diganti dengan versi Drive.')}${appNewer?tr(' Perubahan sejak {t} akan hilang.',{t:fmtStamp(M.info.driveAt)}):''}</div>
      <label class="row" style="gap:10px;font-size:13px;cursor:pointer" data-a="loadKeep"><span class="chk${M.keep?' on':''}">${M.keep?'✓':''}</span>${tr('Simpan versi sekarang ke Drive sebagai cadangan dulu')}</label>
      ${M.err?`<div class="err">${esc(M.err)}</div>`:''}
    </div>
    <div class="pfoot"><button class="btn lg" data-a="close">${tr('Batal')}</button><button class="btn ${appNewer?'red':'g'} lg sp" data-a="loadGo">${tr('Ganti dengan versi Drive')}</button></div>`,500);
}

const A={

  pickJ(d){S.jSel[`${S.y}-${S.m}`]=+d.d;S.jNew=null;render();},
  // + di Journal Today: hari ini kalau belum ada jurnalnya, kalau sudah ada → hari terakhir yang masih kosong
  jNewDash(){

    const last=y===T.y&&m===T.m?T.d:(y>T.y||(y===T.y&&m>T.m)?1:n);
    let d=last;while(d>1&&!free(d))d--;if(!free(d))d=last;
    S.jPrev={ym,d:S.jSel[ym]};S.jSel[ym]=d;S.jNew=ym;render();focusJ();
  },
  // × membatalkan: kembali ke jurnal yang tadi dibuka (teks yang sudah diketik tetap tersimpan)
  jNewCancel(){const p=S.jPrev;if(p&&p.ym===S.jNew){if(p.d==null)delete S.jSel[p.ym];else S.jSel[p.ym]=p.d;}S.jNew=null;S.jPrev=null;render();},
  jWrite(){const T=today();S.jSel[`${S.y}-${S.m}`]=S.y===T.y&&S.m===T.m?T.d:dim(S.y,S.m);render();setTimeout(()=>{const e=document.getElementById('jt-dash');e&&e.focus();});},

    const dr=S.modal.draft;if(!dr.name.trim())return;

      const hs=mm.habits.slice();hs[i]={...hs[i],name:base.name,f:base.f,start:base.start,goal:k===m?goal:hs[i].goal};setHabits(y,k,hs);}});

  dDel(){S.modal.confirm=true;render();},

    setMotiv([...L.slice(0,i+1),c,...L.slice(i+1)]);toast(tr('Template diduplikat'));},
  mvDel(d){S.mvAsk=d.id;render();},
  mvDelNo(){S.mvAsk=null;render();},

  mvRestore(){const L=S.motiv||[],have=new Set(L.map(x=>x.id));setMotiv([...L,...MOTIV_DEF.filter(x=>!have.has(x.id)).map(mvCopy)].slice(0,MV_MAX));toast(tr('Template bawaan dipulihkan'));},
  mvAdd(){const M=S.modal;if(M.items.length>=MV_ITEMS)return;M.items.push('');render();const i=M.items.length-1;setTimeout(()=>{const e=document.getElementById('mv-i-'+i);e&&e.focus();});},

  mvMove(d){const M=S.modal,i=+d.n,j=i+(+d.v);if(j<0||j>=M.items.length)return;[M.items[i],M.items[j]]=[M.items[j],M.items[i]];render();},
  mvSave(){
    const M=S.modal,name=M.name.trim(),items=M.items.map(x=>x.trim().slice(0,MV_LEN)).filter(Boolean);
    if(!name){M.err=tr('Beri nama template dulu.');render();return;}

    else{const id='m'+Math.random().toString(36).slice(2,10);L.push({id,name,items});setMotiv(L);saveSettings({motAct:id});tySync();toast(tr('Template dibuat dan dipakai di Dashboard'));}
  },

  dDelNo(){S.modal.confirm=false;render();},
  dDelYes(){const M=month(S.y,S.m),h=M.habits.find(x=>x.id===S.modal.id);record(tr('hapus habit "{h}"',{h:h.name}),[[S.y,S.m]],()=>setHabits(S.y,S.m,M.habits.filter(x=>x.id!==S.modal.id)));S.modal=null;toast(tr('"{n}" dihapus dari {m} {y}',{n:h.name,m:MID[S.m],y:S.y}));},
  // Jurnal

  jMood(d){const k=d.k,y=+k.slice(0,4),m=+k.slice(5,7)-1,dd=+k.slice(8,10),v=+d.v;setMood(y,m,dd,moodOf(y,m,dd)===v?0:v);},

  moodAdd(){const a=[...moodLabels()];if(a.length>=MAX_MOOD)return;a.push('');setMoods(a);setTimeout(()=>{const e=document.getElementById('ml-'+(a.length-1));e&&e.focus();});},
  // Hapus skor terakhir; kalau skor itu sudah dipakai di data yang terbuka, minta konfirmasi dulu
  moodDel(){const N=moodN();let c=0;Object.values(S.cache).forEach(Y=>Y.months.forEach(M=>M.mood.forEach(v=>{if(v===N)c++;})));if(c){S.moodAsk={n:N,c};render();}else A.moodDelYes();},

const draft=()=>{const M=S.modal;if(M.type==='detail'&&!M.draft){const h=month(S.y,S.m).habits.find(x=>x.id===M.id);M.draft=habitToDraft(h);}return M.draft;};
function touchDraft(){if(S.modal.type==='detail'){S.modal.saved=false;S.modal.confirm=false;}render();}
function focusJ(){setTimeout(()=>{const e=document.getElementById(isMobile()?'jt-m':'jt-dash');if(e){e.focus({preventScroll:true});const l=e.value.length;e.setSelectionRange(l,l);}});}
async function flushNow(){clearTimeout(Q.timer);let guard=0;while((Q.ops.size||Q.inflight)&&!Q.failed&&guard++<40){if(!Q.inflight)await flush();else await new Promise(r=>setTimeout(r,150));}}

async function createYear(y,copy){
  if(S.years.includes(y))return;
  S.modal={type:'addYear',year:y,copy,busy:true};render();
  await flushNow();
  try{
    const data=await call('createYear',y,copy);
    S.cache[y]=data;S.years=[...S.years,y].sort((a,b)=>a-b);
    S.modal=null;S.page='dashboard';S.y=y;const T=today();S.m=y===T.y?T.m:0;
    toast(tr('Lembar {y} siap · 12 bulan',{y}));
  }catch(e){S.modal={type:'addYear',year:y,copy,busy:false,err:tr('Gagal membuat lembar {y}. ',{y})+msg(e)};render();}
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.tagName==='A')e.preventDefault();
  fn(el.dataset,el,e);
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&I[el.dataset.i])I[el.dataset.i](el.value,el.dataset,el);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&C[el.dataset.c])C[el.dataset.c](el.value,el.dataset,el);});
// Pintasan: Ctrl/⌘+Z undo · Ctrl/⌘+Shift+Z / Ctrl+Y redo · Ctrl/⌘+S simpan · ←/→ ganti bulan · ? daftar pintasan
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.menu){S.menu=false;render();}else if(S.modal)A.close();return;}
  const el=e.target,tag=el&&el.tagName,mod=e.metaKey||e.ctrlKey,k=(e.key||'').toLowerCase();
  const typing=tag==='TEXTAREA'||(el&&el.isContentEditable)||(tag==='INPUT'&&!/^(checkbox|radio|button|submit|range|color)$/.test(el.type));
  if(mod&&!e.altKey&&k==='s'){e.preventDefault();saveNow();return;}
  if(typing||S.modal||S.menu||e.altKey||!S.ready||S.page!=='dashboard')return;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(e.ctrlKey&&!e.metaKey&&k==='y'){e.preventDefault();redo();}
  else if(!mod&&tag!=='SELECT'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();stepMonth(e.key==='ArrowLeft'?-1:1);}
  else if(!mod&&e.key==='?'){e.preventDefault();A.showKeys();}
});
// Seret ⋮⋮ untuk mengurutkan habit
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('[data-drag]');if(!r)return;S.dragFrom=+r.dataset.drag;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',r.dataset.drag);}catch(_){}});
document.addEventListener('dragover',e=>{const r=e.target.closest&&e.target.closest('[data-drag]');if(!r||S.dragFrom==null)return;e.preventDefault();document.querySelectorAll('.hrow.over').forEach(x=>x!==r&&x.classList.remove('over'));r.classList.add('over');});
document.addEventListener('drop',e=>{const r=e.target.closest&&e.target.closest('[data-drag]');if(!r||S.dragFrom==null)return;e.preventDefault();const from=S.dragFrom,to=+r.dataset.drag;S.dragFrom=null;if(from===to){render();return;}const hs=month(S.y,S.m).habits.slice();const [x]=hs.splice(from,1);hs.splice(to,0,x);record(tr('urutan habit'),[[S.y,S.m]],()=>setHabits(S.y,S.m,hs));render();});
document.addEventListener('dragend',()=>{S.dragFrom=null;document.querySelectorAll('.hrow.over').forEach(x=>x.classList.remove('over'));});
// Seret ⋮⋮ untuk mengurutkan motivasi di editor template
document.addEventListener('dragstart',e=>{const h=e.target.closest&&e.target.closest('[data-mvdrag]');if(!h)return;S.mvFrom=+h.dataset.mvdrag;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','');e.dataTransfer.setDragImage(h.closest('.mvrow'),16,20);}catch(_){}});
document.addEventListener('dragover',e=>{const r=e.target.closest&&e.target.closest('[data-mvrow]');if(!r||S.mvFrom==null)return;e.preventDefault();document.querySelectorAll('.mvrow.over').forEach(x=>x!==r&&x.classList.remove('over'));r.classList.add('over');});
document.addEventListener('drop',e=>{const r=e.target.closest&&e.target.closest('[data-mvrow]');if(!r||S.mvFrom==null||!S.modal||S.modal.type!=='mv')return;e.preventDefault();const from=S.mvFrom,to=+r.dataset.mvrow;S.mvFrom=null;const it=S.modal.items;if(from!==to){const [x]=it.splice(from,1);it.splice(to,0,x);}render();});
document.addEventListener('dragend',()=>{S.mvFrom=null;document.querySelectorAll('.mvrow.over').forEach(x=>x.classList.remove('over'));});
// Posisi slide dashboard HP diingat per bulan
document.addEventListener('scroll',e=>{const el=e.target;if(!el.dataset||el.dataset.m7==null)return;const sl=el.querySelector('.sl');if(!sl)return;const i=Math.round(el.scrollLeft/sl.offsetWidth);el.dataset.m7=i;S.slide[el.dataset.ym]=i;},true);
let wasMobile=isMobile();
window.addEventListener('resize',()=>{if(isMobile()!==wasMobile){wasMobile=isMobile();render();}});

init();
</script>
